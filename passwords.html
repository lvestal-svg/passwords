<!DOCTYPE html>
<html>
<head>
<title>Password Jigsaw Puzzle</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f5f5f5;
  }
  h1 {
    color: #333;
  }
  #puzzle {
    display: grid;
    grid-template-columns: repeat(5, 80px);
    grid-template-rows: repeat(2, 80px);
    gap: 2px;
    margin: 20px auto;
    width: max-content;
    background-color: #333;
    padding: 2px;
    border-radius: 5px;
  }
  .piece {
    width: 80px;
    height: 80px;
    background-size: 400px 160px; /* matches full puzzle dimensions */
    background-position: center;
    background-color: #ccc;
  }
  .hidden {
    background-color: #999;
    background-image: none !important;
  }
  input {
    padding: 8px;
    font-size: 16px;
    margin-top: 10px;
  }
  #message {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Type the Password to Complete the Jigsaw!</h1>
<div id="puzzle"></div>
<input type="text" id="passwordInput" placeholder="Type password here" autofocus>
<div id="message"></div>

<script>
const PASSWORD = "sunshine"; // your chosen password
const TOTAL_PIECES = 10;
const puzzleImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Sunflower_from_Silesia2.jpg/400px-Sunflower_from_Silesia2.jpg";

let revealedCount = 0;

// Create jigsaw pieces
const puzzle = document.getElementById("puzzle");
let positions = [];
let index = 0;
for (let row = 0; row < 2; row++) {
  for (let col = 0; col < 5; col++) {
    positions.push(`${-col * 80}px ${-row * 80}px`);
    index++;
  }
}

positions.forEach((pos, i) => {
  const piece = document.createElement("div");
  piece.classList.add("piece", "hidden");
  piece.style.backgroundImage = `url('${puzzleImage}')`;
  piece.style.backgroundPosition = pos;
  puzzle.appendChild(piece);
});

const pieces = document.querySelectorAll(".piece");

document.getElementById("passwordInput").addEventListener("keyup", function(e) {
  if (e.key === "Enter") {
    checkPassword();
  }
});

function checkPassword() {
  const input = document.getElementById("passwordInput");
  const message = document.getElementById("message");
  
  if (input.value.trim() === PASSWORD) {
    if (revealedCount < TOTAL_PIECES) {
      pieces[revealedCount].classList.remove("hidden");
      revealedCount++;
      message.textContent = `Correct! ${TOTAL_PIECES - revealedCount} pieces left.`;
      if (revealedCount === TOTAL_PIECES) {
        message.textContent = "🎉 Jigsaw complete! Well done!";
      }
    }
  } else {
    message.textContent = "❌ Incorrect password, try again.";
  }
  input.value = "";
}
</script>

</body>
</html>
